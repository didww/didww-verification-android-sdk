org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# On from day one deliberately. `coreDependencyAllowlist` must read the resolution result
# config-cache-safely (via a Provider), and the reliable way to keep it that way is to have
# the cache reject a violation immediately.
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
